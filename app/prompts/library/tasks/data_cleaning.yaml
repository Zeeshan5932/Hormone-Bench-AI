template: |
  You are an expert Data Engineer and Medical Data Quality Specialist.
  Analyze the following dataset report and quality index to provide actionable data cleaning recommendations in clear bullet points.
  
  Dataset Summary:
  {{ report }}

  Overall Quality Index: {{ quality_index }}%

  Task:
  1. Comment on missing values, outliers, and schema inconsistencies (e.g., column names with awkward spacing like "  I   beta-HCG(mIU/mL)").
  2. Suggest column renaming strategies for standardization.
  3. Provide 3-4 specific recommendations to improve dataset readiness for machine learning.
  
  Do NOT return generic e-commerce YAML examples or Python scripts. Return only concise, dataset-specific recommendations.